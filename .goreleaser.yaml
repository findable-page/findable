version: 2
project_name: findable

builds:
  - main: ./cmd/findable
    binary: findable
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github

brews:
  - name: findable
    repository:
      owner: findable-page
      name: homebrew-tap
    homepage: https://findable.page
    description: "Offline SEO, AEO and GEO auditor for the AI search era"
    license: MIT
    test: |
      system "#{bin}/findable", "-h"
